<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iPAS AI 應用規劃師 - 互動刷題庫</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-16">

  <!-- 頂部導覽列 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i data-lucide="brain" class="text-indigo-600 w-6 h-6"></i>
        <h1 class="text-lg font-bold text-slate-800">iPAS AI 題庫</h1>
      </div>
      <div class="flex items-center space-x-3">
        <button id="openKeyModal" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg flex items-center gap-1 border border-slate-300">
          <i data-lucide="key" class="w-3.5 h-3.5"></i>
          <span id="keyStatusText">設定 AI Key</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="max-w-4xl mx-auto px-4 mt-6">
    <!-- 篩選列 -->
    <div class="flex flex-wrap gap-2 mb-6">
      <button class="filter-btn active bg-indigo-600 text-white px-3 py-1.5 rounded-full text-xs font-medium" data-filter="all">全部題目</button>
      <button class="filter-btn bg-white text-slate-600 border border-slate-200 px-3 py-1.5 rounded-full text-xs font-medium hover:bg-slate-100" data-filter="L11">科目1：基礎概論</button>
      <button class="filter-btn bg-white text-slate-600 border border-slate-200 px-3 py-1.5 rounded-full text-xs font-medium hover:bg-slate-100" data-filter="L12">科目2：生成式AI</button>
      <button class="filter-btn bg-white text-slate-600 border border-slate-200 px-3 py-1.5 rounded-full text-xs font-medium hover:bg-slate-100" data-filter="multiple">僅看多選題</button>
    </div>

    <!-- 題目列表容器 -->
    <div id="quizContainer" class="space-y-6"></div>
  </main>

  <!-- API Key 設定彈跳視窗 -->
  <div id="keyModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl border border-slate-200">
      <h3 class="text-base font-bold text-slate-900 mb-2 flex items-center gap-2">
        <i data-lucide="bot" class="w-5 h-5 text-indigo-600"></i>
        設定 Google Gemini API Key
      </h3>
      <p class="text-xs text-slate-500 mb-4 leading-relaxed">
        可至 <a href="https://aistudio.google.com/" target="_blank" class="text-indigo-600 underline">Google AI Studio</a> 免費取得金鑰。金鑰只會保存在你的瀏覽器中，不會上傳。
      </p>
      <input type="password" id="geminiApiKeyInput" placeholder="貼上 AI Studio 金鑰..." class="w-full text-xs border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4" />
      <div class="flex justify-end space-x-2">
        <button id="closeKeyModal" class="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
        <button id="saveKeyBtn" class="px-4 py-1.5 text-xs bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">儲存金鑰</button>
      </div>
    </div>
  </div>

  <script>
    // 題庫資料
    const questions = [
      {
        id: "L11-001",
        subject: "L11",
        subjectName: "人工智慧基礎概論",
        type: "single",
        category: "機器學習基本概念",
        question: "在機器學習任務中，若希望根據房子的坪數、屋齡與地段來預測其成交價格（連續數值），應採用下列何種模型？",
        options: {
          "A": "分群（Clustering）",
          "B": "迴歸（Regression）",
          "C": "關聯規則（Association Rule）",
          "D": "降維（Dimensionality Reduction）"
        },
        answer: ["B"],
        explanation: "預測連續數值目標屬於監督式學習中的『迴歸』任務；分類任務用於預測離散類別，而分群與降維則多屬於非監督式學習。",
        concept_card: {
          title: "迴歸 vs 分類",
          points: [
            "迴歸（Regression）：目標變數為『連續數值』（如房價、氣溫、股票價格）。",
            "分類（Classification）：目標變數為『離散類別』（如貓狗辨識、垃圾郵件過濾）。"
          ]
        },
        resources: [
          { title: "Scikit-Learn 迴歸模型說明", url: "https://scikit-learn.org/stable/supervised_learning.html#linear-models" }
        ]
      },
      {
        id: "L11-002",
        subject: "L11",
        subjectName: "人工智慧基礎概論",
        type: "multiple",
        category: "模型評估與診斷",
        question: "當監督式機器學習模型在『訓練集』上表現極佳（Accuracy 達 99%），但在『測試集』上表現顯著低落（Accuracy 僅 60%）時，下列哪些處置方式有助於緩解此現象？（多選）",
        options: {
          "A": "增加正規化懲罰項（Regularization，如 L1 / L2）",
          "B": "大幅增加模型參數量與網路深度",
          "C": "收集更多多樣化的訓練資料或進行資料擴增（Data Augmentation）",
          "D": "在神經網路中使用 Dropout 機制"
        },
        answer: ["A", "C", "D"],
        explanation: "題目描述為典型的『過擬合（Overfitting）』。可透過懲罰權重膨脹 (A)、增加資料多樣性 (C) 與隨機丟棄節點 (D) 來抑制過擬合；選項 B 增加複雜度只會使過擬合惡化。",
        concept_card: {
          title: "過擬合（Overfitting）治理方法",
          points: [
            "本質：模型過度記憶雜訊（高變異數 High Variance）。",
            "對策：正則化（L1/L2）、Dropout、提早停止（Early Stopping）、簡化模型結構、擴充資料集。"
          ]
        },
        resources: [
          { title: "機器學習過擬合概念 (Wikipedia)", url: "https://zh.wikipedia.org/wiki/%E8%BF%87%E6%8B%9F%E5%90%88" }
        ]
      },
      {
        id: "L12-001",
        subject: "L12",
        subjectName: "生成式AI應用與規劃",
        type: "single",
        category: "檢索增強生成 (RAG)",
        question: "企業在導入大型語言模型（LLM）建置內部客服系統時，為了讓模型能回答內部最新政策並降低『幻覺（Hallucination）』現象，最適合優先採取的架構為何？",
        options: {
          "A": "耗資從頭預訓練自己的基底大模型",
          "B": "檢索增強生成（Retrieval-Augmented Generation, RAG）",
          "C": "隨機調高模型的 Temperature 參數至 1.8",
          "D": "僅使用 Zero-shot Prompting 且不附帶任何內部參考資料"
        },
        answer: ["B"],
        explanation: "RAG 透過向量比對先從企業內部資料庫檢索精確文件片段，再作為 Context 餵給 LLM 生成回答，能有效結合最新私有資料並降低幻覺。",
        concept_card: {
          title: "RAG 核心流程三步驟",
          points: [
            "1. 索引（Indexing）：文件切塊（Chunking）並轉換為向量（Embeddings）存入向量庫。",
            "2. 檢索（Retrieval）：以使用者問題的向量比對相似度，取出最相關的前 K 篇資料。",
            "3. 生成（Generation）：將檢索到的資料注入 Prompt，由 LLM 整理並生成回答。"
          ]
        },
        resources: [
          { title: "AWS 什麼是檢索增強生成 (RAG)？", url: "https://aws.amazon.com/tw/what-is/retrieval-augmented-generation/" }
        ]
      },
      {
        id: "L12-002",
        subject: "L12",
        subjectName: "生成式AI應用與規劃",
        type: "multiple",
        category: "提示詞工程 (Prompt Engineering)",
        question: "在提示工程（Prompt Engineering）中，下列哪些技巧有助於引導大型語言模型更穩定地執行複雜邏輯推理？（多選）",
        options: {
          "A": "思考鏈（Chain-of-Thought, CoT）：要求模型『一步一步思考』",
          "B": "少樣本提示（Few-shot Prompting）：在提示中提供 2~3 個輸入與輸出的示範範例",
          "C": "思維樹（Tree of Thoughts, ToT）：探索多條分支推演並自我評估",
          "D": "完全省略系統指令（System Role），僅給予簡短模糊的問句"
        },
        answer: ["A", "B", "C"],
        explanation: "CoT (A)、Few-shot (B)、ToT (C) 均是經過驗證能大幅提升複雜任務推理正確性的提示技術。選項 D 容易使模型回答缺乏依循並發散。",
        concept_card: {
          title: "常見進階 Prompt 技術對照",
          points: [
            "Zero-shot：直接提問，不給範例。",
            "Few-shot：給出少數範例引導格式與推理方向。",
            "CoT（Chain-of-Thought）：強制生成中間推理步驟，大幅提高數學與邏輯準確度。"
          ]
        },
        resources: [
          { title: "Prompt Engineering 指南 (Learn Prompting)", url: "https://learnprompting.org/zh-TW/" }
        ]
      }
    ];

    // 初始化與狀態
    let currentFilter = "all";
    const userAnswers = {};

    function init() {
      renderQuestions();
      updateKeyStatus();
      lucide.createIcons();
    }

    // 渲染題目
    function renderQuestions() {
      const container = document.getElementById("quizContainer");
      container.innerHTML = "";

      const filtered = questions.filter(q => {
        if (currentFilter === "all") return true;
        if (currentFilter === "multiple") return q.type === "multiple";
        return q.subject === currentFilter;
      });

      filtered.forEach((q, index) => {
        const card = document.createElement("div");
        card.className = "bg-white border border-slate-200 rounded-xl p-5 shadow-sm";
        card.id = `card-${q.id}`;

        const isMulti = q.type === "multiple";
        const inputType = isMulti ? "checkbox" : "radio";

        let optionsHtml = Object.entries(q.options).map(([optKey, optVal]) => `
          <label class="flex items-start p-3 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 transition-colors opt-label" data-opt="${optKey}">
            <input type="${inputType}" name="q-${q.id}" value="${optKey}" class="mt-0.5 text-indigo-600 focus:ring-indigo-500 rounded border-slate-300 opt-input">
            <span class="ml-3 text-xs leading-relaxed"><strong class="mr-1">${optKey}.</strong> ${optVal}</span>
          </label>
        `).join("");

        let resourcesHtml = q.resources ? q.resources.map(r => `
          <a href="${r.url}" target="_blank" class="inline-flex items-center text-xs text-indigo-600 hover:underline mr-4 mt-1">
            <i data-lucide="external-link" class="w-3 h-3 mr-1"></i>${r.title}
          </a>
        `).join("") : "";

        card.innerHTML = `
          <div class="flex items-center justify-between text-xs text-slate-500 mb-2">
            <span class="bg-indigo-50 text-indigo-700 font-semibold px-2 py-0.5 rounded">${q.id} · ${q.subjectName}</span>
            <span class="font-medium text-slate-400">${isMulti ? "【多選題】" : "【單選題】"} · ${q.category}</span>
          </div>

          <p class="text-sm font-medium text-slate-900 mb-4 leading-normal">${q.question}</p>

          <div class="space-y-2 mb-4" id="options-${q.id}">
            ${optionsHtml}
          </div>

          <div class="flex items-center justify-between border-t border-slate-100 pt-3">
            <button onclick="submitAnswer('${q.id}')" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg transition-colors">
              確認答案
            </button>
            <button onclick="askAI('${q.id}')" class="text-xs text-slate-600 hover:text-indigo-600 flex items-center gap-1">
              <i data-lucide="sparkles" class="w-3.5 h-3.5 text-indigo-500"></i> 問 AI 助教
            </button>
          </div>

          <!-- 詳解與觀念區塊 (作答後顯示) -->
          <div id="result-${q.id}" class="hidden mt-4 pt-4 border-t border-slate-100 space-y-3">
            <div id="badge-${q.id}" class="text-xs font-bold inline-block px-2.5 py-1 rounded"></div>
            
            <div class="text-xs bg-slate-50 p-3 rounded-lg border border-slate-200">
              <p class="font-bold text-slate-800 mb-1">💡 官方詳解：</p>
              <p class="text-slate-600 leading-relaxed">${q.explanation}</p>
            </div>

            <div class="text-xs bg-amber-50/60 p-3 rounded-lg border border-amber-200/60">
              <p class="font-bold text-amber-900 mb-1"> 核心觀念重點卡：${q.concept_card.title}</p>
              <ul class="list-disc pl-4 text-amber-800 space-y-0.5">
                ${q.concept_card.points.map(pt => `<li>${pt}</li>`).join("")}
              </ul>
            </div>

            ${resourcesHtml ? `<div class="pt-1"><span class="text-xs font-semibold text-slate-500 block"> 延伸學習連結：</span>${resourcesHtml}</div>` : ""}

            <!-- AI 助教回覆區塊 -->
            <div id="aiBox-${q.id}" class="hidden text-xs bg-indigo-50/50 p-3 rounded-lg border border-indigo-100 text-indigo-950">
              <div class="flex items-center gap-1.5 font-bold mb-1 text-indigo-700">
                <i data-lucide="bot" class="w-4 h-4"></i> AI 助教即時解析
              </div>
              <div id="aiContent-${q.id}" class="leading-relaxed whitespace-pre-wrap">正在思考中...</div>
            </div>
          </div>
        `;

        container.appendChild(card);
      });

      lucide.createIcons();
    }

    // 提交判定
    window.submitAnswer = function(qId) {
      const q = questions.find(item => item.id === qId);
      const inputs = document.querySelectorAll(`input[name="q-${qId}"]:checked`);
      const selected = Array.from(inputs).map(i => i.value).sort();

      if (selected.length === 0) {
        alert("請先選擇選項！");
        return;
      }

      const resultBox = document.getElementById(`result-${qId}`);
      const badge = document.getElementById(`badge-${qId}`);
      resultBox.classList.remove("hidden");

      const isCorrect = JSON.stringify(selected) === JSON.stringify(q.answer.sort());

      if (isCorrect) {
        badge.className = "text-xs font-bold inline-block px-2.5 py-1 rounded bg-emerald-100 text-emerald-800";
        badge.innerText = ` 作答正確！ 正確答案：${q.answer.join(", ")}`;
      } else {
        badge.className = "text-xs font-bold inline-block px-2.5 py-1 rounded bg-rose-100 text-rose-800";
        badge.innerText = ` 回答錯誤。 正確答案為：${q.answer.join(", ")}（你的選擇：${selected.join(", ")}）`;
      }
    };

    // AI 助教功能
    window.askAI = async function(qId) {
      const apiKey = localStorage.getItem("GEMINI_API_KEY");
      if (!apiKey) {
        document.getElementById("keyModal").classList.remove("hidden");
        return;
      }

      const q = questions.find(item => item.id === qId);
      const aiBox = document.getElementById(`aiBox-${qId}`);
      const aiContent = document.getElementById(`aiContent-${qId}`);
      const resultBox = document.getElementById(`result-${qId}`);

      resultBox.classList.remove("hidden");
      aiBox.classList.remove("hidden");
      aiContent.innerText = "正在向 Gemini AI 請教這道題目...";

      const prompt = `你是一位專業親切的 iPAS AI 應用規劃師考試助教。請用白話、生動好懂的口吻解釋這道題目與正確觀念：
題目：${q.question}
選項：${JSON.stringify(q.options)}
正確答案：${q.answer.join(", ")}
請包含：
1. 為什麼正確答案是這個？
2. 選項中最容易讓人踩坑的盲點在哪？
3. 一句話口訣或生活化記憶法。`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await res.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          aiContent.innerText = data.candidates[0].content.parts[0].text;
        } else {
          aiContent.innerText = "無法取得解析，請確認 API Key 是否有效。";
        }
      } catch (err) {
        aiContent.innerText = "連線失敗，請檢查網路連線或 API Key。";
      }
    };

    // 金鑰管理彈窗事件
    document.getElementById("openKeyModal").onclick = () => document.getElementById("keyModal").classList.remove("hidden");
    document.getElementById("closeKeyModal").onclick = () => document.getElementById("keyModal").classList.add("hidden");
    document.getElementById("saveKeyBtn").onclick = () => {
      const val = document.getElementById("geminiApiKeyInput").value.trim();
      if (val) {
        localStorage.setItem("GEMINI_API_KEY", val);
        updateKeyStatus();
      }
      document.getElementById("keyModal").classList.add("hidden");
    };

    function updateKeyStatus() {
      const key = localStorage.getItem("GEMINI_API_KEY");
      const txt = document.getElementById("keyStatusText");
      if (key) {
        txt.innerText = "AI Key 已啟用";
        txt.parentElement.classList.add("bg-emerald-50", "text-emerald-700", "border-emerald-200");
      }
    }

    // 篩選按鈕事件
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".filter-btn").forEach(b => {
          b.classList.remove("bg-indigo-600", "text-white");
          b.classList.add("bg-white", "text-slate-600");
        });
        btn.classList.add("bg-indigo-600", "text-white");
        btn.classList.remove("bg-white", "text-slate-600");
        currentFilter = btn.dataset.filter;
        renderQuestions();
      };
    });

    // 啟動
    init();
  </script>
</body>
</html>
