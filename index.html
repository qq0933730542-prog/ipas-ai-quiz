<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iPAS AI 應用規劃師 - 790題全功能刷題庫</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20">

  <!-- 頂部導覽列 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i data-lucide="brain" class="text-indigo-600 w-6 h-6"></i>
        <div>
          <h1 class="text-base font-bold text-slate-900 leading-tight">iPAS AI 刷題庫</h1>
          <span id="quizCountSummary" class="text-[11px] text-slate-500">載入中...</span>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button id="openKeyModal" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg flex items-center gap-1 border border-slate-300">
          <i data-lucide="key" class="w-3.5 h-3.5"></i>
          <span id="keyStatusText">AI Key</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 功能主選單 -->
  <div class="bg-indigo-900 text-white py-3 shadow-inner">
    <div class="max-w-4xl mx-auto px-4 flex flex-wrap items-center justify-between gap-2 text-xs">
      <div class="flex flex-wrap items-center gap-2">
        <button id="btnLoadOfficial" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
          <i data-lucide="download-cloud" class="w-3.5 h-3.5"></i> 載入官方 790 題題庫
        </button>
        <button id="btnRandom20" class="bg-indigo-700 hover:bg-indigo-600 text-white px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
          <i data-lucide="shuffle" class="w-3.5 h-3.5"></i> 隨機抽 20 題
        </button>
        <button id="btnMockExam" class="bg-indigo-700 hover:bg-indigo-600 text-white px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
          <i data-lucide="timer" class="w-3.5 h-3.5"></i> 75分鐘模擬考 (50題)
        </button>
        <button id="btnWrongNotebook" class="bg-rose-800/80 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
          <i data-lucide="book-x" class="w-3.5 h-3.5"></i> 錯題本 (<span id="wrongCount">0</span>)
        </button>
      </div>
      <div id="examTimerContainer" class="hidden items-center bg-indigo-950 px-3 py-1 rounded-lg text-amber-300 font-mono font-bold">
        <i data-lucide="clock" class="w-3.5 h-3.5 mr-1 text-amber-400"></i>
        剩餘時間：<span id="examTimer">75:00</span>
      </div>
    </div>
  </div>

  <!-- 主內容容器 -->
  <main class="max-w-4xl mx-auto px-4 mt-6">
    <!-- 篩選列 -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div class="flex flex-wrap gap-1.5 text-xs" id="filterBar">
        <button class="filter-btn active bg-indigo-600 text-white px-3 py-1 rounded-full font-medium" data-filter="all">全部顯示</button>
        <button class="filter-btn bg-white text-slate-600 border border-slate-200 px-3 py-1 rounded-full font-medium hover:bg-slate-100" data-filter="初級">初級考科</button>
        <button class="filter-btn bg-white text-slate-600 border border-slate-200 px-3 py-1 rounded-full font-medium hover:bg-slate-100" data-filter="中級">中級考科</button>
        <button class="filter-btn bg-white text-slate-600 border border-slate-200 px-3 py-1 rounded-full font-medium hover:bg-slate-100" data-filter="multiple">多選題</button>
      </div>

      <div class="text-xs text-slate-500 font-medium">
        當前進度：答對 <span id="statCorrect" class="text-emerald-600 font-bold">0</span> / 作答 <span id="statTotal" class="font-bold">0</span>
      </div>
    </div>

    <!-- 題目列表容器 -->
    <div id="quizContainer" class="space-y-6"></div>
  </main>

  <!-- API Key 設定彈窗 -->
  <div id="keyModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl border border-slate-200">
      <h3 class="text-base font-bold text-slate-900 mb-2 flex items-center gap-2">
        <i data-lucide="bot" class="w-5 h-5 text-indigo-600"></i> 設定 Gemini API Key
      </h3>
      <p class="text-xs text-slate-500 mb-4 leading-relaxed">
        可至 <a href="https://aistudio.google.com/" target="_blank" class="text-indigo-600 underline">Google AI Studio</a> 免費取得 API Key。金鑰僅儲存在本地瀏覽器。
      </p>
      <input type="password" id="geminiApiKeyInput" placeholder="貼上 API Key..." class="w-full text-xs border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4" />
      <div class="flex justify-end space-x-2">
        <button id="closeKeyModal" class="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
        <button id="saveKeyBtn" class="px-4 py-1.5 text-xs bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">儲存</button>
      </div>
    </div>
  </div>

  <script>
    // 預設精選考點題目
    const defaultQuestions = [
      {
        id: "L11-001",
        subject: "初級",
        category: "機器學習基礎概念",
        question: "在機器學習任務中，若希望根據房子的坪數、屋齡與地段來預測其成交價格（連續數值），應採用下列何種模型？",
        options: { "A": "分群（Clustering）", "B": "迴歸（Regression）", "C": "關聯規則（Association Rule）", "D": "主成分分析（PCA）" },
        answer: ["B"],
        explanation: "預測連續數值目標屬於監督式學習中的『迴歸』任務；分類任務預測離散類別，分群與降維則多為非監督式學習。",
        concept_card: { title: "迴歸 vs 分類", points: ["迴歸：目標為連續數值（如價格、溫度）。", "分類：目標為離散標籤（如合格/不合格）。"] }
      },
      {
        id: "L12-001",
        subject: "初級",
        category: "檢索增強生成 (RAG)",
        question: "企業在導入大型語言模型（LLM）建置內部知識庫時，為了降低『幻覺（Hallucination）』並補充最新專有資料，最常優先採取的架構為何？",
        options: { "A": "從頭重新預訓練基底模型", "B": "檢索增強生成（Retrieval-Augmented Generation, RAG）", "C": "大幅調高模型的 Temperature 參數", "D": "改用非監督式分群" },
        answer: ["B"],
        explanation: "RAG 透過向量檢索先從企業內部資料庫找出相關內容，再將其作為 Context 注入 Prompt 交給 LLM 回答，成本低且能大幅緩解幻覺。",
        concept_card: { title: "RAG 核心要素", points: ["Chunking（切塊）與 Embeddings（向量化）", "向量資料庫相似度比對（Top-K 檢索）", "提示詞上下文拼接（Augmented Prompt）"] }
      }
    ];

    let allQuestions = [...defaultQuestions];
    let displayQuestions = [...defaultQuestions];
    let wrongQuestions = JSON.parse(localStorage.getItem("IPAS_WRONG_QUESTIONS") || "[]");
    let currentFilter = "all";
    let answeredStats = { correct: 0, total: 0 };
    let timerInterval = null;

    function init() {
      renderQuestions();
      updateWrongBadge();
      updateSummary();
      updateKeyStatus();
      lucide.createIcons();
    }

    function updateSummary() {
      document.getElementById("quizCountSummary").innerText = `目前題庫共收錄 ${allQuestions.length} 題（顯示中: ${displayQuestions.length} 題）`;
    }

    // 格式標準化函式（相容官方題庫 JSON）
    function normalizeRawQuestion(raw, idx) {
      let opts = {};
      if (Array.isArray(raw.options)) {
        const letters = ["A", "B", "C", "D", "E", "F"];
        raw.options.forEach((opt, i) => { opts[letters[i]] = opt; });
      } else {
        opts = raw.options || {};
      }

      let ans = [];
      if (typeof raw.answer === "number") {
        ans = [["A", "B", "C", "D", "E"][raw.answer]];
      } else if (Array.isArray(raw.answer)) {
        ans = raw.answer.map(a => typeof a === "number" ? ["A", "B", "C", "D"][a] : a);
      } else if (typeof raw.answer === "string") {
        ans = [raw.answer.trim().toUpperCase()];
      }

      return {
        id: raw.id || `Q-${idx + 1}`,
        subject: raw.level || raw.subject || (raw.id && raw.id.includes("L12") ? "初級" : "初級"),
        category: raw.category || raw.topic || "歷屆公告試題",
        type: ans.length > 1 ? "multiple" : "single",
        question: raw.question,
        options: opts,
        answer: ans,
        explanation: raw.explanation || "暫無官方解析說明。",
        concept_card: raw.concept_card || {
          title: raw.topic || "考點重點速記",
          points: ["請仔細理解題目核心定義與名詞辨析。"]
        },
        resources: raw.resources || []
      };
    }

    // 載入官方 790 題題庫
    document.getElementById("btnLoadOfficial").onclick = async () => {
      const btn = document.getElementById("btnLoadOfficial");
      btn.innerHTML = `<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> 下載中...`;
      lucide.createIcons();

      try {
        const res = await fetch("https://yazelin.github.io/ipas-ai-quiz/questions.json");
        const data = await res.json();
        const rawList = data.questions || data;

        allQuestions = rawList.map((q, idx) => normalizeRawQuestion(q, idx));
        displayQuestions = [...allQuestions];

        btn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5"></i> 已載入 790 題`;
        btn.classList.replace("bg-emerald-600", "bg-emerald-700");
        updateSummary();
        renderQuestions();
      } catch (err) {
        alert("載入題庫失敗，請確認網路連線。");
        btn.innerHTML = `<i data-lucide="download-cloud" class="w-3.5 h-3.5"></i> 重新載入`;
      }
      lucide.createIcons();
    };

    // 隨機抽 20 題
    document.getElementById("btnRandom20").onclick = () => {
      displayQuestions = [...allQuestions].sort(() => 0.5 - random()).slice(0, 20);
      renderQuestions();
      updateSummary();
    };

    // 75 分鐘模擬考 (50 題)
    document.getElementById("btnMockExam").onclick = () => {
      displayQuestions = [...allQuestions].sort(() => 0.5 - Math.random()).slice(0, 50);
      renderQuestions();
      updateSummary();
      startExamTimer(75 * 60);
    };

    function startExamTimer(seconds) {
      const container = document.getElementById("examTimerContainer");
      const display = document.getElementById("examTimer");
      container.classList.remove("hidden");
      container.classList.add("flex");

      if (timerInterval) clearInterval(timerInterval);
      let remain = seconds;

      timerInterval = setInterval(() => {
        remain--;
        const m = String(Math.floor(remain / 60)).padStart(2, '0');
        const s = String(remain % 60).padStart(2, '0');
        display.innerText = `${m}:${s}`;

        if (remain <= 0) {
          clearInterval(timerInterval);
          alert("考試時間到！請檢視作答結果。");
        }
      }, 1000);
    }

    // 錯題本模式
    document.getElementById("btnWrongNotebook").onclick = () => {
      if (wrongQuestions.length === 0) {
        alert("目前還沒有任何錯題紀錄！繼續保持！");
        return;
      }
      displayQuestions = [...wrongQuestions];
      renderQuestions();
      updateSummary();
    };

    function updateWrongBadge() {
      document.getElementById("wrongCount").innerText = wrongQuestions.length;
    }

    // 渲染題目列表
    function renderQuestions() {
      const container = document.getElementById("quizContainer");
      container.innerHTML = "";

      let filtered = displayQuestions.filter(q => {
        if (currentFilter === "all") return true;
        if (currentFilter === "multiple") return q.type === "multiple";
        return q.subject && q.subject.includes(currentFilter);
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">無符合條件的題目</div>`;
        return;
      }

      filtered.forEach((q, index) => {
        const card = document.createElement("div");
        card.className = "bg-white border border-slate-200 rounded-xl p-5 shadow-sm";
        card.id = `card-${q.id}`;

        const isMulti = q.type === "multiple";
        const inputType = isMulti ? "checkbox" : "radio";

        let optionsHtml = Object.entries(q.options).map(([optKey, optVal]) => `
          <label class="flex items-start p-3 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 transition opt-label" data-opt="${optKey}">
            <input type="${inputType}" name="q-${q.id}" value="${optKey}" class="mt-0.5 text-indigo-600 focus:ring-indigo-500 rounded border-slate-300">
            <span class="ml-3 text-xs leading-relaxed"><strong class="mr-1">${optKey}.</strong> ${optVal}</span>
          </label>
        `).join("");

        card.innerHTML = `
          <div class="flex items-center justify-between text-xs text-slate-500 mb-2">
            <span class="bg-indigo-50 text-indigo-700 font-semibold px-2 py-0.5 rounded">${q.id} · ${q.subject}</span>
            <span class="font-medium text-slate-400">${isMulti ? "【多選題】" : "【單選題】"} · ${q.category}</span>
          </div>

          <p class="text-sm font-medium text-slate-900 mb-4 leading-normal">${q.question}</p>

          <div class="space-y-2 mb-4">${optionsHtml}</div>

          <div class="flex items-center justify-between border-t border-slate-100 pt-3">
            <button onclick="submitAnswer('${q.id}')" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg transition">
              確認答案
            </button>
            <button onclick="askAI('${q.id}')" class="text-xs text-slate-600 hover:text-indigo-600 flex items-center gap-1">
              <i data-lucide="sparkles" class="w-3.5 h-3.5 text-indigo-500"></i> 問 AI 助教
            </button>
          </div>

          <div id="result-${q.id}" class="hidden mt-4 pt-4 border-t border-slate-100 space-y-3">
            <div id="badge-${q.id}" class="text-xs font-bold inline-block px-2.5 py-1 rounded"></div>
            
            <div class="text-xs bg-slate-50 p-3 rounded-lg border border-slate-200">
              <p class="font-bold text-slate-800 mb-1">💡 題目詳解：</p>
              <p class="text-slate-600 leading-relaxed">${q.explanation}</p>
            </div>

            <div class="text-xs bg-amber-50/60 p-3 rounded-lg border border-amber-200/60">
              <p class="font-bold text-amber-900 mb-1"> 核心觀念重點卡：${q.concept_card?.title || '重點整理'}</p>
              <ul class="list-disc pl-4 text-amber-800 space-y-0.5">
                ${(q.concept_card?.points || []).map(pt => `<li>${pt}</li>`).join("")}
              </ul>
            </div>

            <div id="aiBox-${q.id}" class="hidden text-xs bg-indigo-50/50 p-3 rounded-lg border border-indigo-100 text-indigo-950">
              <div class="flex items-center gap-1.5 font-bold mb-1 text-indigo-700">
                <i data-lucide="bot" class="w-4 h-4"></i> AI 助教白話解析
              </div>
              <div id="aiContent-${q.id}" class="leading-relaxed whitespace-pre-wrap">正在思考中...</div>
            </div>
          </div>
        `;

        container.appendChild(card);
      });

      lucide.createIcons();
    }

    // 作答判定
    window.submitAnswer = function(qId) {
      const q = allQuestions.find(item => item.id === qId) || displayQuestions.find(item => item.id === qId);
      const inputs = document.querySelectorAll(`input[name="q-${qId}"]:checked`);
      const selected = Array.from(inputs).map(i => i.value).sort();

      if (selected.length === 0) {
        alert("請先勾選答案！");
        return;
      }

      const resultBox = document.getElementById(`result-${qId}`);
      const badge = document.getElementById(`badge-${qId}`);
      resultBox.classList.remove("hidden");

      const isCorrect = JSON.stringify(selected) === JSON.stringify(q.answer.sort());

      answeredStats.total++;
      if (isCorrect) {
        answeredStats.correct++;
        badge.className = "text-xs font-bold inline-block px-2.5 py-1 rounded bg-emerald-100 text-emerald-800";
        badge.innerText = ` 作答正確！ 正確答案：${q.answer.join(", ")}`;
      } else {
        badge.className = "text-xs font-bold inline-block px-2.5 py-1 rounded bg-rose-100 text-rose-800";
        badge.innerText = ` 回答錯誤。 正解為：${q.answer.join(", ")}（你選：${selected.join(", ")}）`;

        // 加入錯題本
        if (!wrongQuestions.some(item => item.id === q.id)) {
          wrongQuestions.push(q);
          localStorage.setItem("IPAS_WRONG_QUESTIONS", JSON.stringify(wrongQuestions));
          updateWrongBadge();
        }
      }

      document.getElementById("statCorrect").innerText = answeredStats.correct;
      document.getElementById("statTotal").innerText = answeredStats.total;
    };

    // AI 助教
    window.askAI = async function(qId) {
      const apiKey = localStorage.getItem("GEMINI_API_KEY");
      if (!apiKey) {
        document.getElementById("keyModal").classList.remove("hidden");
        return;
      }

      const q = allQuestions.find(item => item.id === qId) || displayQuestions.find(item => item.id === qId);
      const aiBox = document.getElementById(`aiBox-${qId}`);
      const aiContent = document.getElementById(`aiContent-${qId}`);
      const resultBox = document.getElementById(`result-${qId}`);

      resultBox.classList.remove("hidden");
      aiBox.classList.remove("hidden");
      aiContent.innerText = "正在向 Gemini AI 請教這道題目...";

      const prompt = `你是 iPAS AI 應用規劃師考試助教。請用白話、生動的口吻解釋這道題目：
題目：${q.question}
選項：${JSON.stringify(q.options)}
正確答案：${q.answer.join(", ")}
請用列點提供：
1. 核心觀念生活化比喻
2. 最容易讓人誤選的陷阱
3. 考前記憶口訣`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await res.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          aiContent.innerText = data.candidates[0].content.parts[0].text;
        } else {
          aiContent.innerText = "無法取得解析，請檢查金鑰。";
        }
      } catch (e) {
        aiContent.innerText = "連線失敗，請稍後重試。";
      }
    };

    // API Key 彈窗邏輯
    document.getElementById("openKeyModal").onclick = () => document.getElementById("keyModal").classList.remove("hidden");
    document.getElementById("closeKeyModal").onclick = () => document.getElementById("keyModal").classList.add("hidden");
    document.getElementById("saveKeyBtn").onclick = () => {
      const val = document.getElementById("geminiApiKeyInput").value.trim();
      if (val) {
        localStorage.setItem("GEMINI_API_KEY", val);
        updateKeyStatus();
      }
      document.getElementById("keyModal").classList.add("hidden");
    };

    function updateKeyStatus() {
      const key = localStorage.getItem("GEMINI_API_KEY");
      if (key) {
        document.getElementById("keyStatusText").innerText = "AI Key 已啟用";
        document.getElementById("openKeyModal").classList.add("bg-emerald-50", "text-emerald-700", "border-emerald-300");
      }
    }

    // 篩選按鈕
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".filter-btn").forEach(b => {
          b.classList.remove("bg-indigo-600", "text-white");
          b.classList.add("bg-white", "text-slate-600");
        });
        btn.classList.add("bg-indigo-600", "text-white");
        btn.classList.remove("bg-white", "text-slate-600");
        currentFilter = btn.dataset.filter;
        renderQuestions();
      };
    });

    init();
  </script>
</body>
</html>
