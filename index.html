<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iPAS AI 應用規劃師 - 專屬刷題庫</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-24">

  <!-- ==================== 1. 密碼與驗證碼鎖定層 ==================== -->
  <div id="authGate" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200">
      <div class="flex items-center justify-center w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 mx-auto mb-4">
        <i data-lucide="lock" class="w-6 h-6"></i>
      </div>
      <h2 class="text-base font-bold text-center text-slate-900 mb-1">私人備考題庫驗證</h2>
      <p class="text-xs text-center text-slate-500 mb-5">請輸入通行密碼與驗證碼以解鎖內容</p>

      <!-- 密碼輸入 -->
      <div class="mb-3">
        <label class="block text-[11px] font-semibold text-slate-700 mb-1">通行密碼</label>
        <input type="password" id="inputPassword" placeholder="請輸入密碼..." class="w-full text-xs border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <!-- 動態驗證碼輸入與展示 -->
      <div class="mb-4">
        <label class="block text-[11px] font-semibold text-slate-700 mb-1">安全驗證碼</label>
        <div class="flex items-center gap-2">
          <input type="text" id="inputCaptcha" placeholder="輸入右側 4 碼" maxlength="4" class="flex-1 text-xs border border-slate-300 rounded-lg px-3 py-2 uppercase tracking-wider focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <div id="captchaDisplay" onclick="refreshCaptcha()" title="點擊重新產生驗證碼" class="cursor-pointer select-none bg-slate-100 border border-slate-300 rounded-lg px-3 py-1.5 font-mono text-sm font-bold tracking-widest text-indigo-700 line-through decoration-slate-400">
            0000
          </div>
          <button type="button" onclick="refreshCaptcha()" class="text-slate-400 hover:text-slate-600 p-1">
            <i data-lucide="rotate-cw" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <div id="authErrorMsg" class="hidden text-[11px] text-rose-600 font-medium mb-3"></div>

      <button id="btnUnlock" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold py-2.5 rounded-lg transition shadow-sm">
        解鎖進入題庫
      </button>
    </div>
  </div>

  <!-- ==================== 2. 主應用程式（解鎖後呈現） ==================== -->
  <div id="mainApp" class="hidden">
    <!-- 頂部導覽列 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
      <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <i data-lucide="brain" class="text-indigo-600 w-6 h-6"></i>
          <div>
            <h1 class="text-base font-bold text-slate-900 leading-tight">iPAS AI 題庫</h1>
            <span id="quizCountSummary" class="text-[11px] text-slate-500">載入中...</span>
          </div>
        </div>
        <div class="flex items-center space-x-2">
          <button id="openKeyModal" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg flex items-center gap-1 border border-slate-300">
            <i data-lucide="key" class="w-3.5 h-3.5"></i>
            <span id="keyStatusText">AI Key</span>
          </button>
          <button id="btnLockApp" class="text-xs bg-slate-100 hover:bg-rose-50 hover:text-rose-600 text-slate-600 px-3 py-1.5 rounded-lg flex items-center gap-1 border border-slate-300 transition" title="重新鎖定畫面">
            <i data-lucide="lock" class="w-3.5 h-3.5"></i> 鎖定
          </button>
        </div>
      </div>
    </header>

    <!-- 功能主選單 -->
    <div class="bg-indigo-900 text-white py-3 shadow-inner">
      <div class="max-w-4xl mx-auto px-4 flex flex-wrap items-center justify-between gap-2 text-xs">
        <div class="flex flex-wrap items-center gap-2">
          <button id="btnLoadOfficial" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
            <i data-lucide="download-cloud" class="w-3.5 h-3.5"></i> 載入官方 790 題
          </button>
          <button id="btnRandom20" class="bg-indigo-700 hover:bg-indigo-600 text-white px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
            <i data-lucide="shuffle" class="w-3.5 h-3.5"></i> 隨機 20 題
          </button>
          <button id="btnMockExam" class="bg-indigo-700 hover:bg-indigo-600 text-white px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
            <i data-lucide="timer" class="w-3.5 h-3.5"></i> 75分鐘模擬考 (50題)
          </button>
          <button id="btnWrongNotebook" class="bg-rose-800/80 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
            <i data-lucide="book-x" class="w-3.5 h-3.5"></i> 錯題本 (<span id="wrongCount">0</span>)
          </button>
        </div>
        <div id="examTimerContainer" class="hidden items-center bg-indigo-950 px-3 py-1 rounded-lg text-amber-300 font-mono font-bold">
          <i data-lucide="clock" class="w-3.5 h-3.5 mr-1 text-amber-400"></i>
          剩餘時間：<span id="examTimer">75:00</span>
        </div>
      </div>
    </div>

    <!-- 主內容容器 -->
    <main class="max-w-4xl mx-auto px-4 mt-6">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
        <div class="flex flex-wrap gap-1.5 text-xs" id="filterBar">
          <button class="filter-btn active bg-indigo-600 text-white px-3 py-1 rounded-full font-medium" data-filter="all">全部顯示</button>
          <button class="filter-btn bg-white text-slate-600 border border-slate-200 px-3 py-1 rounded-full font-medium hover:bg-slate-100" data-filter="初級">初級考科</button>
          <button class="filter-btn bg-white text-slate-600 border border-slate-200 px-3 py-1 rounded-full font-medium hover:bg-slate-100" data-filter="中級">中級考科</button>
          <button class="filter-btn bg-white text-slate-600 border border-slate-200 px-3 py-1 rounded-full font-medium hover:bg-slate-100" data-filter="multiple">多選題</button>
        </div>

        <div class="text-xs text-slate-500 font-medium">
          當前進度：答對 <span id="statCorrect" class="text-emerald-600 font-bold">0</span> / 作答 <span id="statTotal" class="font-bold">0</span>
        </div>
      </div>

      <div id="quizContainer" class="space-y-6"></div>
    </main>

    <!-- 右下角懸浮按鈕：開啟「AI 即時聯網助教」 -->
    <div class="fixed bottom-6 right-6 z-40">
      <button id="toggleChatBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white p-3.5 rounded-full shadow-lg flex items-center gap-2 transition hover:scale-105">
        <i data-lucide="sparkles" class="w-5 h-5"></i>
        <span class="text-xs font-semibold pr-1">AI 即時問答</span>
      </button>
    </div>

    <!-- AI 即時對話抽屜 -->
    <div id="chatDrawer" class="fixed bottom-20 right-6 w-96 max-w-[calc(100vw-3rem)] h-[520px] bg-white rounded-2xl shadow-2xl border border-slate-200 z-50 flex flex-col hidden overflow-hidden">
      <div class="bg-indigo-600 text-white px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="bot" class="w-5 h-5"></i>
          <div>
            <h4 class="text-xs font-bold leading-tight">AI 聯網即時助教</h4>
            <span class="text-[10px] text-indigo-200 flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block"></span> 支援 Google 即時聯網搜尋
            </span>
          </div>
        </div>
        <button id="closeChatBtn" class="text-indigo-200 hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-3 text-xs bg-slate-50">
        <div class="bg-white border border-slate-200 p-3 rounded-xl shadow-xs text-slate-700">
           你好！我是你的 iPAS AI 備考即時助教。你可以隨時問我任何觀念或請我整理考點。
        </div>
      </div>

      <div class="p-3 bg-white border-t border-slate-200">
        <div class="flex items-center gap-2">
          <input type="text" id="chatInput" placeholder="輸入問題（如：RAG 與 Fine-tuning 差別）..." class="flex-1 text-xs border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <button id="sendChatBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white p-2 rounded-lg">
            <i data-lucide="send" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- API Key 設定彈窗 -->
  <div id="keyModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl border border-slate-200">
      <h3 class="text-base font-bold text-slate-900 mb-2 flex items-center gap-2">
        <i data-lucide="bot" class="w-5 h-5 text-indigo-600"></i> 設定 Gemini API Key
      </h3>
      <p class="text-xs text-slate-500 mb-4 leading-relaxed">
        可至 <a href="https://aistudio.google.com/" target="_blank" class="text-indigo-600 underline">Google AI Studio</a> 免費取得 API Key。金鑰僅儲存在你自己的本地瀏覽器。
      </p>
      <input type="password" id="geminiApiKeyInput" placeholder="貼上 API Key..." class="w-full text-xs border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4" />
      <div class="flex justify-end space-x-2">
        <button id="closeKeyModal" class="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
        <button id="saveKeyBtn" class="px-4 py-1.5 text-xs bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">儲存</button>
      </div>
    </div>
  </div>

  <script>
    // ==================== 安全通行設定 ====================
    // 你可以在這裡自訂你的密碼：
    const CORRECT_PASSWORD = "ipas2026";
    let currentCaptcha = "";

    function generateCaptcha() {
      const chars = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
      let code = "";
      for (let i = 0; i < 4; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    function refreshCaptcha() {
      currentCaptcha = generateCaptcha();
      document.getElementById("captchaDisplay").innerText = currentCaptcha;
    }

    function checkAuth() {
      const isAuthed = sessionStorage.getItem("IPAS_APP_
