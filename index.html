<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iPAS AI 應用規劃師 - 全真模考題庫</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-28">

  <!-- 頂部導覽列 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">🧠</span>
        <div>
          <h1 class="text-sm font-bold text-slate-900 leading-tight">iPAS AI 全真模擬試卷</h1>
          <span class="text-[11px] text-slate-500">測驗時間：75 分鐘 · 及格標準：70 分</span>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="openKeyModal()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg border border-slate-300">
          🔑 <span id="keyStatusText">AI Key</span>
        </button>
        <button onclick="loadOfficial790()" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-2.5 py-1.5 rounded-lg transition">
          📥 載入官方790題
        </button>
      </div>
    </div>
  </header>

  <!-- 主測驗區 -->
  <main class="max-w-4xl mx-auto px-4 mt-6">

    <!-- 交卷後成績看板 -->
    <div id="scoreReportCard" class="hidden bg-white border border-slate-200 p-6 rounded-2xl shadow-sm mb-6 text-center space-y-3">
      <h2 id="resultTitle" class="text-lg font-bold"></h2>
      <div class="grid grid-cols-4 gap-3 max-w-lg mx-auto text-center py-2">
        <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
          <span class="text-[10px] text-slate-400 block">總題數</span>
          <span id="resTotal" class="text-lg font-bold text-slate-800">0</span>
        </div>
        <div class="bg-emerald-50 p-2.5 rounded-xl border border-emerald-200">
          <span class="text-[10px] text-emerald-600 block">答對</span>
          <span id="resCorrect" class="text-lg font-bold text-emerald-700">0</span>
        </div>
        <div class="bg-rose-50 p-2.5 rounded-xl border border-rose-200">
          <span class="text-[10px] text-rose-600 block">答錯</span>
          <span id="resWrong" class="text-lg font-bold text-rose-700">0</span>
        </div>
        <div class="bg-indigo-50 p-2.5 rounded-xl border border-indigo-200">
          <span class="text-[10px] text-indigo-600 block">得分</span>
          <span id="resScore" class="text-lg font-bold text-indigo-700">0</span>
        </div>
      </div>
      <p class="text-xs text-slate-500">已為您展開每題正解、解析與權威論文對照。答錯題目已自動收錄至錯題紀錄。</p>
      <div class="flex justify-center gap-2 pt-1">
        <button onclick="retryWrongOnly()" id="btnRetryWrong" class="hidden bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">
          🔁 只重練本次錯題
        </button>
        <button onclick="restartExam()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-4 py-2 rounded-lg border border-slate-300 transition">
          🔄 重新測驗整份試卷
        </button>
      </div>
    </div>

    <!-- 考題容器 -->
    <div id="examContainer" class="space-y-4"></div>

    <!-- 底部常駐交卷欄 -->
    <div id="submitBar" class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 py-3 px-4 z-20">
      <div class="max-w-4xl mx-auto flex items-center justify-between">
        <div class="text-xs text-slate-500">
          已作答 <span id="answeredCount" class="font-bold text-indigo-600">0</span> / <span id="totalExamCount" class="font-bold">0</span> 題
        </div>
        <button onclick="submitExam()" id="btnSubmitExam" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs px-6 py-2.5 rounded-xl shadow-sm transition cursor-pointer">
          📝 完成作答，交卷看成績
        </button>
      </div>
    </div>
  </main>

  <!-- AI 助教常駐懸浮鈕 -->
  <div class="fixed bottom-16 right-6 z-30">
    <button onclick="toggleChat()" class="bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-full shadow-lg flex items-center gap-1.5 text-xs font-semibold">
      ✨ <span>AI 助教</span>
    </button>
  </div>

  <!-- AI 抽屜 -->
  <div id="chatDrawer" class="fixed bottom-28 right-6 w-96 max-w-[calc(100vw-3rem)] h-[460px] bg-white rounded-2xl shadow-2xl border border-slate-200 z-40 flex flex-col hidden overflow-hidden text-xs">
    <div class="bg-indigo-600 text-white p-3 flex justify-between items-center">
      <span class="font-bold flex items-center gap-1">🤖 AI 即時聯網論文助教</span>
      <button onclick="toggleChat()" class="font-bold">✕</button>
    </div>
    <div id="chatMessages" class="flex-1 p-3 overflow-y-auto space-y-2 bg-slate-50">
      <div class="bg-white p-2.5 rounded-xl border border-slate-200 text-slate-600">
        你好！我是備考助教。你可以隨時向我提問題目概念或查詢權威論文出處。
      </div>
    </div>
    <div class="p-2.5 bg-white border-t border-slate-200 flex gap-1.5">
      <input type="text" id="chatInput" placeholder="問問題（如：RAG 論文核心機制）..." onkeydown="if(event.key==='Enter') sendChat()" class="flex-1 border border-slate-300 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
      <button onclick="sendChat()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg font-bold">送出</button>
    </div>
  </div>

  <!-- API Key 彈窗 -->
  <div id="keyModal" class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-xl max-w-sm w-full p-5 shadow-xl border border-slate-200 text-xs">
      <h3 class="font-bold mb-2">🔑 設定 Gemini API Key</h3>
      <input type="password" id="apiKeyInput" placeholder="貼上 Google AI Studio Key..." class="w-full border border-slate-300 rounded-lg p-2 mb-3" />
      <div class="flex justify-end gap-2">
        <button onclick="closeKeyModal()" class="px-3 py-1.5 text-slate-600">取消</button>
        <button onclick="saveKey()" class="px-3 py-1.5 bg-indigo-600 text-white rounded-lg">儲存</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
